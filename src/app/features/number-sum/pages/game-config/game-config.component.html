<div class="config-container">
  <header class="config-header">
    <h2 class="config-title">Sequence Settings</h2>
    <p class="config-subtitle">Configure the quantity, speed, and difficulty of the numbers.</p>
  </header>

  <form [formGroup]="formConfig" class="form-config" (ngSubmit)="startGame()">
    <div class="section">
      <app-dropdown
        label="Digits"
        placeholder="Select number of digits"
        formControlName="digits"
        [options]="digitsOptions"
      />
    </div>

    <div class="section">
      <app-dropdown
        label="Time Interval"
        [options]="intervals"
        placeholder="Select speed"
        formControlName="interval"
      />
    </div>

    <div class="section">
      <app-dropdown
        label="Quantity"
        [options]="numberOptions"
        placeholder="Select quantity"
        formControlName="amount"
      />
    </div>

    <app-button 
      text="START SUMMING!" 
      fullWidth 
      [disabled]="!formConfig.valid" 
    />
  </form>
</div>
