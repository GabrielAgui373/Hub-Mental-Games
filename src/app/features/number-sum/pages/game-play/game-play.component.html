@if(!finish()) {
<div class="display-area">
  @if (currentStep(); as step) { @for (item of [step]; track item.id) {
  <span
    class="display-number animate-in"
    [class.is-countdown]="item.isPrep"
    [style.animation-duration.ms]="item.isPrep ? 500 : config.interval * 0.2"
  >
    {{ item.value }}
  </span>
  } }
</div>
} @else {
<div class="answer-container">
  <app-input-text
    [autofocus]="true"
    size="xl"
    type="number"
    [formControl]="answer"
    placeholder="0"
    (keydown.enter)="answer.valid && checkResult()"
  />

  <app-button
    text="Check!"
    fullWidth
    size="lg"
    (click)="checkResult()"
    [disabled]="!answer.valid"
  />
</div>
}
