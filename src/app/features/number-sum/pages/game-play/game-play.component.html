@switch (status()) { @case ('countdown') {
  <app-countdown [startDue]="500" (finished)="onCountdownFinished()" />
} @case ('running') {
<div class="center-content">
  @if (currentStep(); as step) { @for (item of [step]; track item.id) {
  <span
    class="display-number"
    [style.animation-duration.ms]="config.interval * 0.2"
  >
    {{ item.value }}
  </span>
  } }
</div>
} @case ('finished') {
<div class="answer-container animate-slide-up">
  <app-input-text
    [autofocus]="true"
    size="xl"
    type="number"
    [formControl]="answerControl"
    placeholder="0"
    (keydown.enter)="answerControl.valid && checkResult()"
  />

  <app-button
    text="Check!"
    fullWidth
    size="lg"
    (click)="checkResult()"
    [disabled]="answerControl.invalid"
  />
</div>
} }
