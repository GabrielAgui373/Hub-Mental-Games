@if(label()) {
<span class="input-text-label">{{ label() }}</span>
}

<div class="input-text-container" [class]="'size-' + size()" [class.disabled]="isDisabled()">
  <input
    type="text"
    class="input-text"
    [placeholder]="placeholder()"
    [value]="value()"
    [disabled]="isDisabled()"
    (input)="onInput($event)"
  />
</div>
