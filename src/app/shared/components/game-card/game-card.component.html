<div class="card" [class.is-expanded]="expanded()" [attr.data-theme]="game().theme">
  <div class="card__header" (click)="toggleDetails()">
    <div class="card__title-container">
      <h3 class="card__title">{{ game().title }}</h3>
      <div class="card__badge">NEW</div>
    </div>
    
    <button class="card__toggle-btn" [attr.aria-label]="expanded() ? 'Collapse' : 'Expand'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="card__icon">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
  </div>

  <p class="card__description">{{ game().description }}</p>

  <div class="card__expand-wrapper">
    <div class="card__expand-inner">
      <div class="card__details-content">
        <span class="card__details-label">Quick Guide</span>
        <p>{{ game().details }}</p>
      </div>
    </div>
  </div>

  <div class="card__actions">
    <app-button
      text="PLAY NOW"
      variant="primary"
      [fullWidth]="true"
      (click)="navigateToGame()"
    >
    </app-button>
  </div>
</div>
