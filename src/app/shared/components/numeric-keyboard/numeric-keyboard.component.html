<div class="keyboard-grid">
  @for(number of numbers; track number) {
    <button type="button" class="icon-btn" (click)="onKeyClick(number)">
      <span class="number-text">{{ number }}</span>
    </button>
  }

  <button type="button" class="icon-btn key-0" (click)="onKeyClick(0)">
    <span class="number-text">0</span>
  </button>

  <button type="button" class="icon-btn key-backspace" (click)="onKeyClick('backspace')" aria-label="Apagar">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z" />
      <line x1="18" y1="9" x2="12" y2="15" /><line x1="12" y1="9" x2="18" y2="15" />
    </svg>
  </button>

  <button type="button" class="icon-btn key-enter" (click)="onKeyClick('enter')" aria-label="Confirmar">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
  </button>
</div>
