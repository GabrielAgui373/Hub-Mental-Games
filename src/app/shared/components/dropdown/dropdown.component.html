<div class="dropdown-wrapper">
  @if(label()) {
  <span class="dropdown-label">{{ label() }}</span>
  }

  <div class="dropdown-container" (click)="toggleDropdownOpen()">
    <span class="dropdown-placeholder">{{ placeholder() }}</span>
    <svg
      class="dropdown-arrow"
      [class.is-open]="isOpen()"
      xmlns="http://www.w3.org/2000/svg"
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="dropdown-arrow"
    >
      <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
  </div>

  @if(isOpen()) {
    <div class="dropdown-panel-list" animate.enter="is-open">
    @for(option of options(); track $index) {
    <span
      class="dropdown-option"
      [class.is-selected]="selectedOption() === option"
      >{{ option.label }}</span
    >
    } @empty {
    <span>{{ emptyOptionsText() }}</span>
    }
  </div>
  }
</div>
